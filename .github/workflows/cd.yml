name: CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "notebooks/**"

env:
  DOCKER_IMAGE: movie-recommender
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image locally
        run: docker build -t movie-recommender:test .

      - name: Smoke test container
        run: |
          docker run -d --name test-app -p 7860:7860 movie-recommender:test
          sleep 15
          curl -f http://localhost:7860/ || (docker logs test-app && exit 1)
          docker stop test-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          docker compose -f docker-compose.prod.yml up -d